<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <title>Kiosco | Familiares</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../scripts/color.js"></script>
</head>
<body>
    <div class="d-flex">

        <aside class="sidebar d-flex flex-column p-3">
            <div class="mb-4">
                <h4 class="fw-bold text-primary mb-0">Kiosco</h4>
                <small class="text-secondary">Portal del empleado</small>
            </div>

            <ul class="nav nav-pills flex-column gap-1 flex-grow-1">
                <li class="nav-item">
                    <a href="dashboard.html" class="nav-link d-flex align-items-center gap-2">
                        <i class="bi bi-grid-fill"></i> Inicio
                    </a>
                </li>
                <li class="nav-item">
                    <a href="nomina.html" class="nav-link d-flex align-items-center gap-2">
                        <i class="bi bi-file-earmark-text"></i> Mi Nómina
                    </a>
                </li>
                <li class="nav-item">
                    <a href="prestaciones.html" class="nav-link d-flex align-items-center gap-2">
                        <i class="bi bi-star"></i> Prestaciones
                    </a>
                </li>
                <li class="nav-item">
                    <a href="asistencia.html" class="nav-link d-flex align-items-center gap-2">
                        <i class="bi bi-clock-history"></i> Asistencia
                    </a>
                </li>
                <li class="nav-item">
                    <a href="documentos.html" class="nav-link d-flex align-items-center gap-2">
                        <i class="bi bi-folder"></i> Documentos
                    </a>
                </li>
                <li class="nav-item">
                    <a href="desempeno.html" class="nav-link d-flex align-items-center gap-2">
                        <i class="bi bi-graph-up"></i> Mi Desempeño
                    </a>
                </li>
                <li class="nav-item">
                    <a href="comunidad.html" class="nav-link d-flex align-items-center gap-2">
                        <i class="bi bi-people"></i> Comunidad
                    </a>
                </li>
                <li class="nav-item">
                    <a href="familiares.html" class="nav-link active d-flex align-items-center gap-2">
                        <i class="bi bi-people-fill"></i> Familiares
                    </a>
                </li>
                <li class="nav-item">
                    <a href="perfil.html" class="nav-link d-flex align-items-center gap-2">
                        <i class="bi bi-person"></i> Mi Perfil
                    </a>
                </li>
                <li class="nav-item">
                    <a href="juego.html" class="nav-link d-flex align-items-center gap-2">
                        <i class="bi bi-controller"></i> Zona de Juego
                    </a>
                </li>
            </ul>

            <div class="mt-4">
                <small class="text-secondary d-block mb-2">Color del portal</small>
                <div class="d-flex gap-2">
                    <button class="color-dot active" style="background:#2b4bd6" data-color="#2b4bd6" aria-label="Azul"></button>
                    <button class="color-dot" style="background:#1fa855" data-color="#1fa855" aria-label="Verde"></button>
                    <button class="color-dot" style="background:#e0338c" data-color="#e0338c" aria-label="Rosa"></button>
                    <button class="color-dot" style="background:#f0932b" data-color="#f0932b" aria-label="Naranja"></button>
                </div>
            </div>

            <div class="d-flex align-items-center gap-2 mt-4 pt-3 border-top">
                <div class="avatar-circle">CM</div>
                <div>
                    <div class="fw-semibold small">Carlos Mendoza</div>
                    <div class="text-secondary small">Emp. 00124</div>
                </div>
            </div>
        </aside>

        <main class="main-content flex-grow-1">
            <header class="d-flex justify-content-between align-items-center px-4 py-3 border-bottom">
                <h5 class="mb-0 fw-semibold">Familiares</h5>
                <div class="d-flex align-items-center gap-3">
                    <i class="bi bi-moon fs-5"></i>
                    <span class="position-relative">
                        <i class="bi bi-bell fs-5"></i>
                        <span class="notif-dot"></span>
                    </span>
                    <a href="index.html" class="text-secondary text-decoration-none small">Cerrar sesión</a>     
                </div>
            </header>

            <div class="p-4">

                <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-4">
                    <div>
                        <h2 class="fw-bold mb-1">Familiares y beneficiarios</h2>
                        <p class="text-secondary mb-0" id="contadorFam"></p>
                    </div>
                    <div class="d-flex align-items-center gap-3">
                        <div class="segmentado">
                            <button type="button" class="activo" data-vista="familiares">Mis Familiares</button>
                            <button type="button" data-vista="avisos">Avisos y Beneficios</button>
                        </div>
                        <button class="btn btn-primary fw-semibold btn-portal" id="btnAgregar">Agregar familiar</button>
                    </div>
                </div>

                <div class="row g-3" id="vistaFamiliares">
                    <div class="col-lg-4">
                        <div class="d-grid gap-2" id="listaFamiliares"></div>
                    </div>
                    <div class="col-lg-8">
                        <div class="panel" id="detalleFamiliar"></div>
                    </div>
                </div>

                <div class="d-none" id="vistaAvisos"></div>

            </div>
        </main>
    </div>

    <div class="modal fade" id="modalFamiliar" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content p-2">
                <div class="modal-body">
                    <h6 class="fw-bold mb-3" id="modalFamTitulo">Agregar familiar</h6>

                    <div class="row g-3 mb-3">
                        <div class="col-md-8">
                            <label class="form-label small mb-1" for="fNombre">Nombre completo</label>
                            <input type="text" class="form-control" id="fNombre">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small mb-1" for="fParentesco">Parentesco</label>
                            <select class="form-select" id="fParentesco"></select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small mb-1" for="fCurp">CURP</label>
                            <input type="text" class="form-control text-uppercase" id="fCurp" maxlength="18">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small mb-1" for="fNacimiento">Fecha de nacimiento</label>
                            <input type="date" class="form-control" id="fNacimiento">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small mb-1" for="fGenero">Género</label>
                            <select class="form-select" id="fGenero">
                                <option>Femenino</option>
                                <option>Masculino</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small mb-1" for="fEstadoCivil">Estado civil</label>
                            <select class="form-select" id="fEstadoCivil">
                                <option>Soltero(a)</option>
                                <option>Casado(a)</option>
                                <option>Unión libre</option>
                                <option>Divorciado(a)</option>
                                <option>Viudo(a)</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small mb-1" for="fOcupacion">Ocupación</label>
                            <input type="text" class="form-control" id="fOcupacion">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small mb-1" for="fTelefono">Teléfono</label>
                            <input type="tel" class="form-control" id="fTelefono">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small mb-1" for="fCelular">Teléfono celular</label>
                            <input type="tel" class="form-control" id="fCelular">
                        </div>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-md-4"><div class="form-check"><input class="form-check-input" type="checkbox" id="fDependiente"><label class="form-check-label small" for="fDependiente">Dependiente</label></div></div>
                        <div class="col-md-4"><div class="form-check"><input class="form-check-input" type="checkbox" id="fBeneficiario"><label class="form-check-label small" for="fBeneficiario">Beneficiario</label></div></div>
                        <div class="col-md-4"><div class="form-check"><input class="form-check-input" type="checkbox" id="fEmergencia"><label class="form-check-label small" for="fEmergencia">Contacto emergencia</label></div></div>
                        <div class="col-md-4"><div class="form-check"><input class="form-check-input" type="checkbox" id="fVive"><label class="form-check-label small" for="fVive">Vive con empleado</label></div></div>
                        <div class="col-md-4"><div class="form-check"><input class="form-check-input" type="checkbox" id="fTrabaja"><label class="form-check-label small" for="fTrabaja">Trabaja en empresa</label></div></div>
                        <div class="col-md-4"><div class="form-check"><input class="form-check-input" type="checkbox" id="fDiscapacidad"><label class="form-check-label small" for="fDiscapacidad">Discapacidad</label></div></div>
                    </div>

                    <div class="d-flex justify-content-end align-items-center gap-3">
                        <button class="btn btn-link text-secondary text-decoration-none" data-bs-dismiss="modal">Cancelar</button>
                        <button class="btn btn-primary fw-semibold btn-portal" id="btnGuardarFam" disabled>Guardar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <button class="fab-chat" aria-label="Chat"><i class="bi bi-chat-dots"></i></button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../scripts/familiares.js"></script>
    <script src="../scripts/identidad-atlas.js"></script>
</body>
</html>
